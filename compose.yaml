services:
  api:
    build:
      context: .
      dockerfile: ops/docker/api.Dockerfile
    environment:
      PATENT_EVIDENCE_DATABASE_URL: postgresql+asyncpg://patent_evidence_app:${PATENT_EVIDENCE_APP_DB_PASSWORD:-app-change-me-local-only}@postgres:5432/${POSTGRES_DB:-patent_evidence}
      PATENT_EVIDENCE_PLATFORM_DATABASE_URL: postgresql+asyncpg://patent_evidence_platform:${PATENT_EVIDENCE_PLATFORM_DB_PASSWORD:-platform-change-me-local-only}@postgres:5432/${POSTGRES_DB:-patent_evidence}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: ops/docker/worker.Dockerfile
    environment:
      PATENT_EVIDENCE_WORKER_DATABASE_URL: postgresql+asyncpg://patent_evidence_worker:${PATENT_EVIDENCE_WORKER_DB_PASSWORD:-worker-change-me-local-only}@postgres:5432/${POSTGRES_DB:-patent_evidence}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "patent_evidence_worker.main", "health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: ops/docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patent_evidence}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-change-me-local-only}
      PATENT_EVIDENCE_MIGRATION_DB_PASSWORD: ${PATENT_EVIDENCE_MIGRATION_DB_PASSWORD:-migration-change-me-local-only}
      PATENT_EVIDENCE_APP_DB_PASSWORD: ${PATENT_EVIDENCE_APP_DB_PASSWORD:-app-change-me-local-only}
      PATENT_EVIDENCE_PLATFORM_DB_PASSWORD: ${PATENT_EVIDENCE_PLATFORM_DB_PASSWORD:-platform-change-me-local-only}
      PATENT_EVIDENCE_WORKER_DB_PASSWORD: ${PATENT_EVIDENCE_WORKER_DB_PASSWORD:-worker-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: ops/docker/migrate.Dockerfile
    environment:
      PATENT_EVIDENCE_MIGRATION_DATABASE_URL: postgresql+psycopg://patent_evidence_migration:${PATENT_EVIDENCE_MIGRATION_DB_PASSWORD:-migration-change-me-local-only}@postgres:5432/${POSTGRES_DB:-patent_evidence}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-patent_evidence_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
