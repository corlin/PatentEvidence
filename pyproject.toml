[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "patent-evidence"
version = "0.1.0"
description = "Patent evidence SaaS scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/src/patent_evidence_api",
  "apps/worker/src/patent_evidence_worker",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/worker/tests", "tests/unit"]
addopts = "-q"
pythonpath = ["apps/api/src", "apps/worker/src"]
